[package]
name = "sandlock-supervise"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Single-generation supervisor entry for one pre-provisioned sandlock sandbox (fork route B)"

[lib]
name = "sandlock_supervise"
path = "src/lib.rs"

[[bin]]
name = "sandlock-supervise"
path = "src/main.rs"

[dependencies]
sandlock-core = { version = "0.9.0-beta", path = "../sandlock-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }

[dev-dependencies]
libc = "0.2"

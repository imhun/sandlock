[source.crates-io]
replace-with = 'rsproxy'

[source.rsproxy]
registry = "sparse+https://rsproxy.cn/index/"

[net]
git-fetch-with-cli = true
retry = 8

[http]
timeout = 300
low-speed-limit = 1

# Cross-linkers (zig): setuptools-rust invokes `cargo rustc --target <triple>`,
# which picks up these per-target configs and links the cdylib with
# `zigcc -target <triple>` (see zigcc in this directory).
[target.x86_64-unknown-linux-gnu]
linker = "zigcc"
rustflags = ["-C", "link-arg=-target", "-C", "link-arg=x86_64-linux-gnu.2.34"]

[target.aarch64-unknown-linux-gnu]
linker = "zigcc"
rustflags = ["-C", "link-arg=-target", "-C", "link-arg=aarch64-linux-gnu.2.34"]
